<h2 class="card-text">Register new user</h2>
  <div class="container">
    <div class="row">
      <div class="col-lg-4 col-lg-offset-4">
        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
          <div class="form-group">
            <label for="usernameInput">Username</label>
            <input type="text" class="form-control" id="usernameInput" aria-describedby="usernameHelp" placeholder="Enter username" required
              [(ngModel)]="username" name="username">
            <!-- <small id="usernameHelp" class="form-text text-muted">We'll never share your login credentials with anyone else.</small> -->
          </div>
          <div class="form-group">
            <label for="nameInput">Full name</label>
            <input type="text" class="form-control" id="nameInput" aria-describedby="nameHelp" placeholder="Enter full name" required
              [(ngModel)]="name" name="name">
            <!-- <small id="usernameHelp" class="form-text text-muted">We'll never share your login credentials with anyone else.</small> -->
          </div> 
          <div class="form-group">
            <label for="passwordInput">Password</label>
            <input type="password" class="form-control" id="passwordInput" placeholder="Password" required [(ngModel)]="password" name="password">
          </div>
          <div class="form-group">
            <label for="passwordRepeatInput">Repeat password</label>
            <input type="password" class="form-control" id="passwordRepeatInput" placeholder="Password" required [(ngModel)]="passwordRepeat"
              name="passwordRepeat">
          </div>
          <button type="submit" class="btn btn-primary" [disabled]="!registerForm.form.valid">Register</button>
        </form>
      </div>
    </div>
  </div>
