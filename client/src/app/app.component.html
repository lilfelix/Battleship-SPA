<div class="container">
  <div class=" card text-center ">
    <div class="card-header ">
      <ul class="nav nav-tabs card-header-tabs ">
        <li class="nav-item ">
          <a routerLink="/profile" routerLinkActive="active " [style.pointer-events]="loggedIn ? 'auto' : 'none'">{{ status }}</a>
        </li>
        <li class="nav-item ">
          <a *ngIf="!loggedIn" routerLink="/login" routerLinkActive="active ">Login</a>
          <a *ngIf="loggedIn" routerLink="/logout" routerLinkActive="active ">Logout</a>
        </li>
        <li class="nav-item ">
          <a routerLink="/lobby" routerLinkActive="active ">Lobby</a>
        </li>
        <li class="nav-item ">
          <!-- <a [style.pointer-events]="gameStarted ? 'auto' : 'none'" routerLink="/game" routerLinkActive="active ">Game</a> -->
          <a routerLink="/game" routerLinkActive="active ">Game</a>
        </li>
        <li class="nav-item ">
          <a routerLink="/highscore" routerLinkActive="active ">Highscore</a>
        </li>
      </ul>
    </div>
    <div class="card-body ">
      <h1 class="card-title ">Play some friggin' {{ title }}!
      </h1>
      <p class="card-text ">Challenge opponents, chat and view highscore</p>
    </div>
    <!-- Routed views go here -->
    <router-outlet></router-outlet>
  </div>
</div>
