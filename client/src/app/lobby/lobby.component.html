<div [style.pointer-events]="loggedIn ? 'auto' : 'none'">
  <div class="row">
    <div class="col-sm-6">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Available Players</h4>
          <div class="list-group">
            <div *ngFor="let player of players" class="list-group-item">
              <button type="button" class="btn btn-success" (click)="issueChallenge(player);">Challenge {{player.username}}</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-sm-6">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Pending Challenges</h4>
          <div class="list-group">
            <div *ngFor="let challenge of challenges" class="list-group-item">
              <!-- If user issued challenge, it can be canceled -->
              <div *ngIf="challenge.issuer == user.username">
                <label for="accept">You have challenged {{challenge.receiver}}</label>
                <button type="button" class="btn btn-danger" (click)="updateChallenge(challenge, 'cancel');">Cancel</button>
              </div>
              <!-- If user received challenge, it can be accepted/rejected -->
              <div *ngIf="challenge.receiver == user.username">
                <label for="accept">{{challenge.issuer}} challenged you to a game!</label>
                <button id="accept" type="button" class="btn btn-success" (click)="updateChallenge(challenge, 'accept');">Accept</button>
                <button id="reject" type="button" class="btn btn-danger" (click)="updateChallenge(challenge, 'reject');">Reject</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-12">
      <app-chat [user]="user"></app-chat>
    </div>
  </div>
</div>
