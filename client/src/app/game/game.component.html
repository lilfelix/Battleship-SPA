<div class="row" [style.opacity]="gameOver ? '0.5' : '1'">
  <div class="col-sm-12">
    <div class="alert alert-secondary" role="alert">
      <h3> {{ statusMsg }} </h3>
    </div>
  </div>
</div>
<div class="row" [style.opacity]="gameOver ? '0.5' : '1'">
  <div class="col-sm-12">
    <app-board [players]="players" [size]="size" [clientTurn]="clientTurn" [gameStarted]="gameStarted" [gameOver]="gameOver"></app-board>
  </div>
</div>
