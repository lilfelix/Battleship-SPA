<div class="card">
  <div class="card-body">
    <h4 class="card-title">{{ user.username }}'s profile</h4>
    <div *ngIf="!editing">
      <div class="alert alert-primary" role="alert">
        <p class="font-weight-bold">Full name: {{ user.name }}</p>
        <p class="font-weight-bold">Username: {{ user.username }}</p>
      </div>
        <button type="button" class="btn btn-primary" (click)="editProfile()">Edit profile</button>
    </div>
    <div *ngIf="editing">
      <form (ngSubmit)="onSubmit()" #profileForm="ngForm">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" class="form-control" id="usernameInput" aria-describedby="usernameHelp" placeholder="Enter username" required
            [(ngModel)]="user.username" name="user.username">
        </div>
        <div class="form-group">
          <label for="nameInput">Full name</label>
          <input type="text" class="form-control" id="nameInput" aria-describedby="nameHelp" placeholder="Enter full name" required
            [(ngModel)]="user.name" name="user.name">
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="!profileForm.form.valid">Save changes</button>
      </form> 
    </div>
  </div>
</div>
